name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar el ID de cliente de Google (si existe)
        env:
          CID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          mkdir _site
          cp index.html _site/index.html
          if [ -n "$CID" ]; then
            sed -i "s|name=\"brumaltea-google-client-id\" content=\"\"|name=\"brumaltea-google-client-id\" content=\"$CID\"|" _site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
